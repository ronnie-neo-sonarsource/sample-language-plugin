mode.mqr.advertisement=버그, 취약점 또는 코드 냄새를 찾고 계십니까? 팀이 이러한 유형을 선호하는 경우 <a>설정</a>에서 변경하세요.
mode.standard.advertisement=보안, 신뢰성 및 유지보수성 문제를 찾고 계십니까? 팀이 소프트웨어 품질을 선호하는 경우 <a>설정</a>에서 변경하세요.
mode_tour.link=문서에서 모드에 대해 자세히 알아보기
mode_tour.name=표준 경험 및 MQR 모드 투어
mode_tour.step1.description=<p1>우리는 <b>표준 경험</b>과 <b>다중 품질 규칙 (MQR) 모드</b>라는 두 가지 모드를 도입하여 여러분과 팀이 익숙한 워크플로를 계속 사용하거나 새로운 개념을 탐색할 수 있도록 했습니다.</p1><p>이 투어를 통해 두 모드 간의 차이점을 확인하세요.</p>
mode_tour.step1.img_alt=두 가지 새로운 모드에서 문제의 차이를 시각적으로 표현
mode_tour.step1.title=SonarQube 서버 {version}에 오신 것을 환영합니다!
mode_tour.step2.description=<p1>표준 경험은 <b>취약점</b>, <b>버그</b>, <b>코드 냄새</b>와 같은 규칙 유형의 사용을 포함합니다. 각 규칙은 단일 유형과 심각도 수준을 가지며, 적절한 권한으로 사용자 정의할 수 있습니다.</p1><p>이 접근 방식은 가장 큰 영향을 미치는 단일 소프트웨어 품질(예: 보안, 신뢰성 또는 유지보수성)에 기반하여 규칙에 심각도를 할당하는 데 중점을 둡니다.</p>
mode_tour.step2.img_alt=표준 경험 배지의 새로운 모습: 취약점, 버그 및 코드 냄새의 시각적 표현
mode_tour.step2.title=표준 경험
mode_tour.step3.description=<p1>새로운 다중 품질 규칙 모드는 모든 소프트웨어 품질에 대한 문제의 영향을 보다 정확하게 나타내는 것을 목표로 합니다.Â </p1><p>보안, 신뢰성 및 유지보수성과 같은 각 소프트웨어 품질에 대해 규칙에 별도의 심각도를 할당하여 유형(취약점, 버그 및 코드 냄새)을 대체합니다. 적절한 권한으로 심각도 수준을 사용자 정의할 수 있습니다.</p><p>이 접근 방식은 가장 심각한 영향을 받는 하나의 품질뿐만 아니라 모든 소프트웨어 품질에 대한 영향을 명확히 하는 데 중점을 둡니다.</p>
mode_tour.step3.img_alt=새로운 소프트웨어 품질 배지: 보안, 신뢰성 및 유지보수성과 해당 표준 경험 배지와의 연결을 시각적으로 표현
mode_tour.step3.title=다중 품질 규칙 모드
mode_tour.step4.description=<p1>현재 <b>{mode}</b>에 있습니다.</p1><p>적절한 권한으로 관리 > 구성 > 일반 설정 > 모드로 이동하여 변경할 수 있습니다.</p><p>업그레이드 중인 소프트웨어 버전과 가장 유사한 모드로 인스턴스가 시작됩니다.</p>
mode_tour.step4.img_alt=관리 설정에서 표준 경험과 MQR 모드 간의 전환을 시각적으로 표현
mode_tour.step4.title=모드 전환
mode_tour.step5.title=도움말 섹션에서 투어를 다시 재생할 수 있습니다.
