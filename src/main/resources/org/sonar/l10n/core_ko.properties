component_measures.overview.Coverage.description=누락된 테스트 커버리지의 장기적인 위험을 확인하십시오. 키보드를 사용하는 사용자를 위해 요소는 파일당 누락된 줄 수량에 따라 정렬됩니다. 버블 크기는 누락된 줄의 양을 나타내며, 각 버블의 수직 위치는 누락된 커버리지의 양을 반영합니다. 아래 가장자리의 작은 버블이 가장 좋습니다.
component_measures.overview.Duplications.description=중복의 장기적인 위험을 확인하십시오. 키보드를 사용하는 사용자를 위해 요소는 파일당 중복된 블록 수에 따라 정렬됩니다. 버블 크기는 중복된 블록의 양을 나타내며, 각 버블의 수직 위치는 해당 블록의 줄 수를 반영합니다. 아래 가장자리의 작은 버블이 가장 좋습니다.
component_measures.overview.Maintainability.description=코드 스멜의 장기적인 위험을 확인하십시오. 키보드를 사용하는 사용자를 위해 요소는 파일당 코드 스멜의 양에 따라 정렬됩니다. 버블의 색상이 빨간색에 가까울수록 기술적 부채 비율이 높습니다. 버블 크기는 코드 스멜의 양을 나타내며, 각 버블의 수직 위치는 코드 스멜을 해결하는 데 필요한 예상 시간을 반영합니다. 아래 가장자리의 작은 녹색 버블이 가장 좋습니다.
component_measures.overview.Reliability.description=버그의 운영 위험을 확인하십시오. 키보드를 사용하는 사용자를 위해 요소는 파일당 버그의 양에 따라 정렬됩니다. 버블의 색상이 빨간색에 가까울수록 가장 심각한 버그가 더 심각합니다. 버블 크기는 버그의 양을 나타내며, 각 버블의 수직 위치는 버그를 해결하는 데 필요한 예상 시간을 반영합니다. 아래 가장자리의 작은 녹색 버블이 가장 좋습니다.
component_measures.overview.Security.description=취약점의 운영 위험을 확인하십시오. 키보드를 사용하는 사용자를 위해 요소는 파일당 취약점의 양에 따라 정렬됩니다. 버블의 색상이 빨간색에 가까울수록 가장 심각한 취약점이 더 심각합니다. 버블 크기는 취약점의 양을 나타내며, 각 버블의 수직 위치는 취약점을 해결하는 데 필요한 예상 시간을 반영합니다. 아래 가장자리의 작은 녹색 버블이 가장 좋습니다.
component_measures.overview.project_overview.description=운영 위험에 대한 빠른 통찰력을 얻으십시오. 키보드를 사용하는 사용자를 위해 요소는 각 파일의 코드 줄 수에 따라 정렬됩니다. 녹색이 아닌 색상은 즉각적인 위험을 나타냅니다: 검토해야 할 버그 또는 취약점. 그래프의 상단 또는 오른쪽에 위치하면 장기적인 건강이 위험할 수 있습니다. 왼쪽 아래의 녹색 버블이 가장 좋습니다.
